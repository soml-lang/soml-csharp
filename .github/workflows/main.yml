name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      # Pack before the default outputs exist to catch hard-coded build paths and missing package files, such as the readme.
      - run: dotnet pack src/Soml --configuration Release --artifacts-path artifacts
      - run: dotnet test --configuration Release
      - run: dotnet pack src/Soml.Extensions.Configuration --configuration Release
      - run: dotnet pack tools/Soml.Cli --configuration Release
